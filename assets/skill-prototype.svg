<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">A reusable skill rubric: Bound-Based Conclusion and Synthesis</title>
<desc id="desc">The paper's prototype specifies its usage, reasoning pattern, a zero-to-three scoring rubric, and the boundary-leak failure mode.</desc>
<rect width="1120" height="470" rx="22" fill="#F5F7FC"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="42" fill="#6366F1" font-size="15" font-weight="700" letter-spacing="2">INSIDE A SKILL PROTOTYPE</text>
<text x="36" y="82" fill="#172554" font-size="29" font-weight="700">Bound-Based Conclusion &amp; Synthesis</text>
<text x="36" y="116" fill="#475569" font-size="18">One checklist for similar subgoals across different problems.</text>
<rect x="36" y="144" width="494" height="281" rx="14" fill="white" stroke="#CBD5E1"/>
<rect x="550" y="144" width="534" height="281" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
<g fill="#172554" font-size="19" font-weight="700"><text x="58" y="179">When to use it</text><text x="58" y="270">A concrete failure: boundary leak</text><text x="572" y="179">Shared scoring criteria</text></g>
<g fill="#475569" font-size="18"><text x="58" y="210">Conclude a reasoning chain from</text><text x="58" y="237">established bounds or constraints.</text><text x="58" y="301">An integer bound is left as c &lt; 44.75,</text><text x="58" y="328">without stating c ≤ 44.</text></g>
<rect x="58" y="351" width="445" height="49" rx="10" fill="#FFF7ED"/><text x="74" y="382" fill="#9A3412" font-size="17" font-weight="700">Paper example: incomplete subgoal → score 2</text>
<g font-size="18" fill="#334155"><text x="579" y="221">3   Rigorous conclusion with tightness</text><text x="579" y="264">2   Correct conclusion with a minor slip</text><text x="579" y="307">1   Major logical gap</text><text x="579" y="350">0   Wrong or premature conclusion</text></g>
<text x="572" y="397" fill="#6366F1" font-size="16">Route subgoal → apply rubric → assign reward</text>
<text x="36" y="452" fill="#64748B" font-size="14">Adapted from the compact Skill Prototype in the camera-ready paper; illustrative example, not an additional experiment.</text>
</g></svg>
